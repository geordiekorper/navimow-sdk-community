[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navimow-sdk-community"
dynamic = ["version"]
description = "Python SDK for cloud mower platform integration with smart home systems."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Navimow R&D Team", email = "segwaynavimowapp@gmail.com"}
]
keywords = ["mower", "sdk", "home-assistant", "iot", "mqtt", "oauth2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Home Automation",
]

dependencies = [
    "aiohttp>=3.9.0",
    "paho-mqtt>=1.6.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/geordiekorper/navimow-sdk-community"
Documentation = "https://github.com/geordiekorper/navimow-sdk-community#readme"
Repository = "https://github.com/geordiekorper/navimow-sdk-community"
Issues = "https://github.com/geordiekorper/navimow-sdk-community/issues"

[tool.setuptools.dynamic]
version = {attr = "mower_sdk.__version__"}

[tool.setuptools.packages.find]
include = ["mower_sdk*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"
