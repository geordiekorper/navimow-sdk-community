[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navimow-sdk-community"
dynamic = ["version"]
description = "Python SDK for cloud mower platform integration with smart home systems."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Navimow R&D Team", email = "segwaynavimowapp@gmail.com"}
]
maintainers = [
    {name = "Geordie Korper"}
]
keywords = ["mower", "sdk", "home-assistant", "iot", "mqtt", "oauth2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Home Automation",
]

dependencies = [
    "aiohttp>=3.9.0",
    "paho-mqtt>=2.1.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "nox>=2025.5.1",
    "pre-commit",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/geordiekorper/navimow-sdk-community"
Documentation = "https://github.com/geordiekorper/navimow-sdk-community#readme"
Repository = "https://github.com/geordiekorper/navimow-sdk-community"
Issues = "https://github.com/geordiekorper/navimow-sdk-community/issues"

[tool.setuptools.dynamic]
version = {attr = "mower_sdk.__version__"}

[tool.setuptools.packages.find]
include = ["mower_sdk*"]

[tool.pytest.ini_options]
# From 8.4 an async test without its marker fails; before, pytest skipped it
# with a warning and the suite stayed green.
minversion = "8.4"
testpaths = ["tests"]
# pytest-asyncio: each async test is marked, and each runs on a loop of its
# own. Both are the plugin's defaults; the loop scope is set because the
# plugin warns while it is unset, and the core-isolation run turns warnings
# into errors.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
# The package is type-checked in strict mode, read as the oldest supported
# Python reads it. nox -s types runs it, and so does CI.
python_version = "3.11"
strict = true
files = ["mower_sdk"]

[[tool.mypy.overrides]]
# Legacy code moved verbatim from upstream is not edited, so what the checker
# finds in it cannot be corrected here.
module = "mower_sdk.legacy.*"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Legacy code moved verbatim from upstream is never reformatted. Nor are the
# Python blocks in the documents, which ruff would format too: they are
# fragments wrapped for reading, and tests run two of the documents as printed.
exclude = ["mower_sdk/legacy/**", "*.md"]

[tool.ruff.lint]
# Ruff rule set for the whole tree. CI runs it as a blocking check.
# E501 is the line length: the formatter keeps code within it, and a string,
# comment or docstring line it cannot shorten is wrapped by hand.
# I is the import order. RUF100 reports a noqa comment that suppresses
# nothing, so the suppressions stay true.
# D is the docstrings, in the Google form (Args, Returns, Raises sections):
# every module, class and function of the package has one, and an Args section
# names every argument. The DOC rules hold a docstring to the code: a value
# returned or yielded and an exception raised are documented, and nothing is
# documented that the function does not take, return or yield. ruff still
# marks the DOC rules as preview, so preview mode is on for the rules named
# here and for no others. tests/test_docstrings.py adds what ruff has no rule
# for: a function with parameters has an Args section at all.
preview = true
explicit-preview-rules = true
select = [
    "F", "ARG", "B", "UP", "SIM", "E501", "I", "RUF100",
    "D", "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Legacy code moved verbatim from upstream keeps only the F rules, so it is
# never reformatted or modernised here; that keeps merge-back diffs small.
"mower_sdk/legacy/**" = ["ARG", "B", "SIM", "UP", "E501", "I", "RUF100", "D", "DOC"]
# The tests and the tools keep the rules for the form of a docstring, not the
# ones that require one everywhere or hold it to the code.
"tests/**" = ["D1", "DOC"]
"tools/**" = ["D1", "DOC"]
"noxfile.py" = ["D1", "DOC"]
