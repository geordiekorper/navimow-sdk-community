# Release a version tag using PyPI trusted publishing (OIDC), so no API
# token is stored anywhere. Every v* tag builds the sdist and wheel once,
# uploads them to TestPyPI unattended, and then waits at the pypi job: that
# job runs in the pypi environment, whose required-reviewer rule holds it
# until the owner approves the deployment, so nothing reaches PyPI before
# the release has been tested. A failed TestPyPI upload stops the run before
# PyPI. Both indexes list this repository as the project's trusted
# publisher: owner geordiekorper, repository navimow-sdk-community, workflow
# publish.yml, environment testpypi on test.pypi.org and pypi on pypi.org.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check that the tag matches mower_sdk.__version__
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import sys

          tree = ast.parse(pathlib.Path("mower_sdk/__init__.py").read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
          )
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match mower_sdk.__version__ {version}")
          print(f"releasing {version}")
          PY
      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: upload to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/navimow-sdk-community/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: upload to PyPI
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/navimow-sdk-community/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
