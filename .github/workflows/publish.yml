# Release a version tag using PyPI trusted publishing (OIDC), so no API
# token is stored anywhere. Every v* tag builds the sdist and wheel once,
# runs a consumer's tests against the wheel when the repository variables
# name one, uploads the files to TestPyPI unattended, checks that TestPyPI
# serves them as built and that the release installs from there and passes
# its tests, and then waits at the pypi job: that job runs in the pypi
# environment, whose required-reviewer rule holds it until the owner
# approves the deployment, and its first step refuses the upload until the
# release has soaked on a live installation, so nothing reaches PyPI before
# the release has been tested and run. A failed job stops the run before
# the jobs after it. Both indexes list this repository as the project's
# trusted publisher: owner geordiekorper, repository navimow-sdk-community,
# workflow publish.yml, environment testpypi on test.pypi.org and pypi on
# pypi.org.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check that the tag matches mower_sdk.__version__
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import sys

          tree = ast.parse(pathlib.Path("mower_sdk/__init__.py").read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
          )
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not match mower_sdk.__version__ {version}")
          print(f"releasing {version}")
          PY
      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  compat:
    name: a consumer's tests against the wheel
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The consumer: a public repository as owner/name, and the ref to check
    # out, from the repository variables CONSUMER_REPOSITORY and
    # CONSUMER_REF. Its scripts/test-against-sdk.sh runs the consumer's own
    # tests against the wheel it is given and exits non-zero when they fail.
    # With no consumer named, the job passes and the run's summary says so.
    env:
      CONSUMER_REPOSITORY: ${{ vars.CONSUMER_REPOSITORY }}
      CONSUMER_REF: ${{ vars.CONSUMER_REF }}
    steps:
      - name: Is a consumer named?
        id: consumer
        run: |
          if [ -n "$CONSUMER_REPOSITORY" ] && [ -n "$CONSUMER_REF" ]; then
            echo "named=true" >> "$GITHUB_OUTPUT"
            echo "consumer: $CONSUMER_REPOSITORY at $CONSUMER_REF"
          else
            echo "named=false" >> "$GITHUB_OUTPUT"
            message="No consumer named: the repository variables CONSUMER_REPOSITORY and CONSUMER_REF are not both set, so no consumer's tests ran against the wheel."
            echo "::notice::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v8
        if: steps.consumer.outputs.named == 'true'
        with:
          name: dist
          path: dist/
      - uses: actions/checkout@v7
        if: steps.consumer.outputs.named == 'true'
        with:
          repository: ${{ env.CONSUMER_REPOSITORY }}
          ref: ${{ env.CONSUMER_REF }}
          path: consumer
          persist-credentials: false
      - name: Run the consumer's test entry point against the wheel
        if: steps.consumer.outputs.named == 'true'
        working-directory: consumer
        run: |
          set -- "$GITHUB_WORKSPACE"/dist/*.whl
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected one wheel in dist/, found: $*"
            exit 1
          fi
          scripts/test-against-sdk.sh --wheel "$1"

  testpypi:
    name: upload to TestPyPI
    needs: [build, compat]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/navimow-sdk-community/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-verify:
    name: install from TestPyPI and test (py${{ matrix.python-version }})
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Check that TestPyPI serves the files the build made
        run: python tools/check_index.py --index https://test.pypi.org "${GITHUB_REF_NAME#v}" dist/
      - name: Install the wheel TestPyPI serves into a fresh environment
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv "$RUNNER_TEMP/venv"
          python="$RUNNER_TEMP/venv/bin/python"
          # The simple index can lag the upload by a few seconds: ask up to six times.
          attempt=1
          until "$python" -m pip download --no-deps --no-cache-dir --only-binary :all: \
              --index-url https://test.pypi.org/simple/ --dest "$RUNNER_TEMP/served" \
              "navimow-sdk-community==$version"; do
            if [ "$attempt" -ge 6 ]; then
              echo "TestPyPI did not serve navimow-sdk-community $version in $attempt attempts"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 20
          done
          cmp "$RUNNER_TEMP"/served/*.whl dist/*.whl
          "$python" -m pip install "$RUNNER_TEMP"/served/*.whl pytest pytest-asyncio
      - name: Run the tag's tests against the installed package from another directory
        run: |
          python="$RUNNER_TEMP/venv/bin/python"
          mkdir "$RUNNER_TEMP/checkout"
          git archive HEAD tests | tar -x -C "$RUNNER_TEMP/checkout"
          cd "$RUNNER_TEMP/checkout"
          "$python" -c 'import mower_sdk; print("importing", mower_sdk.__file__)'
          "$python" -m pytest tests
          "$python" "$GITHUB_WORKSPACE/tools/check_wheel.py" metadata

  pypi:
    name: upload to PyPI
    needs: [build, testpypi, testpypi-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/navimow-sdk-community/
    permissions:
      id-token: write
      statuses: read
    steps:
      # The release must have soaked on a live installation first. Whoever
      # deploys it there reports the outcome as the commit status
      # navimow-alpha/soak on the tag's commit, and this step refuses the
      # upload until that status is success. docs/releasing.md says how the
      # owner records a waiver.
      - name: Refuse to upload a release whose soak has not passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME/status" \
            --jq '[.statuses[] | select(.context == "navimow-alpha/soak") | .state] | first // "absent"')"
          if [ "$state" != "success" ]; then
            echo "::error::navimow-alpha/soak on $GITHUB_REF_NAME is $state, not success: the release has not passed its soak; re-run this job once it has"
            exit 1
          fi
          echo "navimow-alpha/soak on $GITHUB_REF_NAME is success"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
