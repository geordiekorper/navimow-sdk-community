# CI: the verification steps of the packaging commits, the public-API
# compatibility test and the legacy quarantine, made permanent. The checks
# themselves are nox sessions (noxfile.py), so what CI runs can be run
# locally with the same command. Five jobs:
#   test    nox -s tests-X and tools-X: the test suite from the source tree
#           on every supported Python, plus the core-isolation test with
#           DeprecationWarning as an error, and the commit checks' own tests
#   bounds  nox -s "bounds(oldest|newest)": the oldest and newest allowed
#           aiohttp and paho-mqtt, plus a construction check outside a loop,
#           under a loop set as current and inside a running one, and a
#           credential update in both connection states, since paho's setters
#           are what could differ between versions
#   wheel   nox -s wheel: build, check that mower_sdk and mower_sdk.legacy
#           ship, install into a fresh venv, test from another directory, so
#           a wheel that omits a package fails here and nowhere else
#   ruff    nox -s lint: blocking; legacy code keeps only the F rules
#           (pyproject.toml)
#   hygiene the pre-commit hooks over every file and over the changes of the
#           pull request (or push); gitlint and the message leak check over
#           the range's commit messages
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NOX: nox==2026.8.17

jobs:
  test:
    name: compat test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "$NOX"
      - name: Run the test suite and the core-isolation test
        run: nox -s "tests-${{ matrix.python-version }}"
      - name: Tests of the commit checks
        run: nox -s "tools-${{ matrix.python-version }}"

  bounds:
    name: dependency bounds (py${{ matrix.python-version }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            label: oldest
          - python-version: "3.14"
            label: newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "$NOX"
      - name: Run the suite and the construction check on the ${{ matrix.label }} dependencies
        run: nox -s "bounds(${{ matrix.label }})"

  wheel:
    name: build, install and test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$NOX"
      - name: Build, check, install into a fresh venv and test from another directory
        run: nox -s wheel

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$NOX"
      # Rule set: [tool.ruff.lint] in pyproject.toml; mower_sdk/legacy/ keeps
      # only the F rules through per-file-ignores. Any finding fails the job.
      - name: ruff check
        run: nox -s lint -- --output-format github .

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install pre-commit and gitlint
        run: python -m pip install pre-commit==4.6.2 gitlint==0.19.1
      # The hook environments (a Go toolchain building gitleaks and actionlint,
      # the Python hooks) are built once per configuration, not on every run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The commits this run is about: a pull request's own commits, or the
      # ones a push to main added. Without a usable base (a manual run, a new
      # branch, a force push) only the whole-tree checks run.
      - name: Find the base of the range
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=""; fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "range: ${base:-none}..HEAD"
      # The edit guards refuse any existing protected file, so a whole-tree
      # run skips them; the range run below checks the changes.
      - name: Every hook over every file
        env:
          GATE_MODE: content
          # ruff-check: the ruff job checks the tree already.
          SKIP: no-legacy-edits,no-inventory-edits,ruff-check
        run: pre-commit run --all-files --show-diff-on-failure
      # A deliberate change to a protected path is sanctioned per commit by a
      # "Legacy-edit: <reason>" trailer, which gitlint checks below; the
      # file-level guards cannot see trailers, so the range run skips them.
      - name: The hooks over the range's changes
        if: env.BASE != ''
        env:
          SKIP: no-legacy-edits,no-inventory-edits,no-protected-deletions,ruff-check
        run: pre-commit run --from-ref "$BASE" --to-ref HEAD --show-diff-on-failure
      - name: The range's commit messages
        if: env.BASE != ''
        run: gitlint --commits "$BASE..HEAD"
      - name: Local paths and untracked names in the range's commit messages
        if: env.BASE != ''
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            pre-commit run check-message-leaks --hook-stage commit-msg \
              --commit-msg-filename "$RUNNER_TEMP/message" || { echo "in $sha"; status=1; }
          done
          exit "$status"
