# Phase 0 CI: the verification steps of the packaging commits and of the
# public-API compatibility test, made permanent. Four jobs:
#   test    the compat test from the source tree on every supported Python
#   bounds  the oldest and newest allowed aiohttp and paho-mqtt, plus a
#           construction check that must run inside an event loop (3.14)
#   wheel   build, install into a fresh venv, test from another directory,
#           so a wheel that omits a package fails here and nowhere else
#   ruff    advisory until Phase 1 fixes the two undefined names (Q6)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: compat test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and pytest
        run: python -m pip install -e . pytest
      - name: Run the public-API compatibility test
        run: python -m pytest

  bounds:
    name: dependency bounds (py${{ matrix.python-version }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            label: oldest
            pins: aiohttp==3.9.0 paho-mqtt==1.6.1
          - python-version: "3.14"
            label: newest
            pins: aiohttp paho-mqtt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with ${{ matrix.label }} dependencies
        run: |
          python -m pip install --upgrade . ${{ matrix.pins }} pytest
          python -m pip list --format=freeze | grep -iE '^(aiohttp|paho-mqtt)=='
      - name: Run the public-API compatibility test
        run: python -m pytest
      - name: Construct the MQTT classes inside a running event loop
        run: |
          python - <<'PY'
          import asyncio
          import sys

          import aiohttp
          import paho.mqtt

          from mower_sdk import MowerMQTT, NavimowMQTT, NavimowSDK


          async def main() -> None:
              # MowerMQTT builds its paho client lazily; NavimowMQTT builds it in __init__.
              MowerMQTT("broker.invalid")._build_client()
              NavimowMQTT("broker.invalid", 8883, None, None, records=[])
              NavimowSDK("broker.invalid", 8883)
              print(
                  f"constructed on Python {sys.version.split()[0]}, "
                  f"aiohttp {aiohttp.__version__}, paho-mqtt {paho.mqtt.__version__}"
              )


          asyncio.run(main())
          PY

  wheel:
    name: build, install and test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check that the wheel ships the package and nothing else
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          (wheel,) = glob.glob("dist/*.whl")
          names = zipfile.ZipFile(wheel).namelist()
          print("\n".join(names))
          stray = [n for n in names if not (n.startswith("mower_sdk/") or ".dist-info/" in n)]
          if stray:
              sys.exit(f"unexpected files in {wheel}: {stray}")
          if "mower_sdk/__init__.py" not in names:
              sys.exit(f"{wheel} does not contain mower_sdk")
          PY
      - name: Install the wheel into a fresh venv and test it from another directory
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl pytest
          cp -R tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          venv/bin/python -c 'import mower_sdk; print("importing", mower_sdk.__file__)'
          venv/bin/python -m pytest tests
      - name: Check the installed wheel's identity, version and license metadata
        run: |
          cd "$RUNNER_TEMP"
          venv/bin/python - <<'PY'
          import sys
          from importlib.metadata import distribution

          import mower_sdk

          dist = distribution("navimow-sdk-community")
          problems = []
          if dist.metadata["Name"] != "navimow-sdk-community":
              problems.append(f"Name is {dist.metadata['Name']!r}")
          if dist.version != mower_sdk.__version__:
              problems.append(f"version {dist.version!r} != mower_sdk.__version__ {mower_sdk.__version__!r}")
          if dist.metadata["License-Expression"] != "GPL-3.0-only":
              problems.append(f"License-Expression is {dist.metadata['License-Expression']!r}")
          licenses = [
              path
              for path in dist.files or []
              if path.name == "LICENSE"
              and path.parent.name == "licenses"
              and path.parent.parent.name.endswith(".dist-info")
          ]
          if not licenses:
              problems.append("dist-info/licenses/LICENSE is not packaged")
          elif not licenses[0].locate().is_file():
              problems.append(f"{licenses[0]} is recorded but missing")
          elif "GNU GENERAL PUBLIC LICENSE" not in licenses[0].read_text()[:200]:
              problems.append(f"{licenses[0]} is not the GPL text")
          print(f"{dist.metadata['Name']} {dist.version}, {dist.metadata['License-Expression']}")
          if problems:
              sys.exit("wheel metadata: " + "; ".join(problems))
          PY

  ruff:
    name: ruff (advisory until Phase 1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ruff
      # Rule set: [tool.ruff.lint] in pyproject.toml. Upstream's untouched code
      # has two F821 names (state_manager.py, navimow.py) that Phase 1 fixes
      # while moving the files; until then findings are annotations, not
      # failures.
      - name: ruff check
        run: ruff check --output-format github .
        continue-on-error: true
