# CI: the verification steps of the packaging commits, the public-API
# compatibility test and the legacy quarantine, made permanent. The checks
# themselves are nox sessions (noxfile.py), so what CI runs can be run
# locally with the same command. Four jobs:
#   test    nox -s tests-X and tools-X: the test suite from the source tree
#           on every supported Python, plus the core-isolation test with
#           DeprecationWarning as an error, and the commit checks' own tests
#   bounds  nox -s "bounds(oldest|newest)": the oldest and newest allowed
#           aiohttp and paho-mqtt, plus a construction check outside a loop,
#           under a loop set as current and inside a running one, and a
#           credential update in both connection states, since paho's setters
#           are what could differ between versions
#   wheel   nox -s wheel: build, check that mower_sdk and mower_sdk.legacy
#           ship, install into a fresh venv, test from another directory, so
#           a wheel that omits a package fails here and nowhere else
#   ruff    nox -s lint: blocking; legacy code keeps only the F rules
#           (pyproject.toml)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NOX: nox==2026.8.17

jobs:
  test:
    name: compat test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "$NOX"
      - name: Run the test suite and the core-isolation test
        run: nox -s "tests-${{ matrix.python-version }}"
      - name: Tests of the commit checks
        run: nox -s "tools-${{ matrix.python-version }}"

  bounds:
    name: dependency bounds (py${{ matrix.python-version }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            label: oldest
          - python-version: "3.14"
            label: newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "$NOX"
      - name: Run the suite and the construction check on the ${{ matrix.label }} dependencies
        run: nox -s "bounds(${{ matrix.label }})"

  wheel:
    name: build, install and test the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$NOX"
      - name: Build, check, install into a fresh venv and test from another directory
        run: nox -s wheel

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$NOX"
      # Rule set: [tool.ruff.lint] in pyproject.toml; mower_sdk/legacy/ keeps
      # only the F rules through per-file-ignores. Any finding fails the job.
      - name: ruff check
        run: nox -s lint -- --output-format github .
